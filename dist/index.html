    function appendTiwariSurname(str) {
      if (!str) return '';
      const trimmed = str.trim();
      if (!trimmed) return '';

      const isHindi = /[\u0900-\u097F]/.test(trimmed);

      if (isHindi) {
        if (!trimmed.endsWith('तिवारी')) {
          return trimmed + ' तिवारी';
        }
        return trimmed;
      } else {
        if (!trimmed.toLowerCase().endsWith('tiwari')) {
          return trimmed + ' Tiwari';
        }
        return trimmed;
      }
    }

    function compressImageFile(file, callback) {
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        alert('फ़ोटो की साइज 10 MB से कम होनी चाहिए (Maximum 10MB)');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 600;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
          callback(compressedBase64);
        };
        img.onerror = () => callback(e.target.result);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    const HINDI_MONTHS = {
      'जनवरी': 1, 'फरवरी': 2, 'मार्च': 3, 'अप्रैल': 4, 'मई': 5, 'जून': 6,
      'जुलाई': 7, 'अगस्त': 8, 'सितंबर': 9, 'अक्टूबर': 10, 'नवंबर': 11, 'दिसंबर': 12
    };

    const ENGLISH_MONTHS = {
      'jan': 1, 'january': 1, 'feb': 2, 'february': 2, 'mar': 3, 'march': 3,
      'apr': 4, 'april': 4, 'may': 5, 'june': 6, 'jun': 6,
      'jul': 7, 'july': 7, 'aug': 8, 'august': 8, 'sep': 9, 'september': 9,
      'oct': 10, 'october': 10, 'nov': 11, 'november': 11, 'dec': 12, 'december': 12
    };

    const MONTH_NAMES_ENGLISH = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const MONTH_NAMES_HINDI = [
      'जनवरी', 'फरवरी', 'मार्च', 'अप्रैल', 'मई', 'जून',
      'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'
    ];

    function parseDobDayMonth(dobStr) {
      if (!dobStr) return null;
      const str = String(dobStr).trim();
      
      if (str.match(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/)) {
        const parts = str.split(/[\/\-]/);
        return { day: parseInt(parts[0], 10), month: parseInt(parts[1], 10) };
      }
      
      const tokens = str.replace(/[,]/g, '').split(/[\s\-]+/);
      let day = null;
      let month = null;

      for (let tok of tokens) {
        const num = parseInt(tok, 10);
        if (!isNaN(num) && num >= 1 && num <= 31 && day === null) {
          day = num;
        }
        const lowerTok = tok.toLowerCase();
        if (HINDI_MONTHS[lowerTok]) month = HINDI_MONTHS[lowerTok];
        else if (ENGLISH_MONTHS[lowerTok]) month = ENGLISH_MONTHS[lowerTok];
      }

      if (day !== null && month !== null) {
        return { day, month };
      }
      return null;
    }

    function extractDetailsFromName(rawName) {
      let cleanName = rawName.trim();
      let notes = [];
      let marriagesCount = 1;
      let marriageNote = null;

      const matches = rawName.match(/\(([^)]+)\)/g);
      if (matches) {
        matches.forEach(m => {
          const note = m.replace(/[\(\)]/g, '').trim();
          if (note.includes('शादी')) {
            marriageNote = note;
            if (note.includes('तीन') || note.includes('3')) marriagesCount = 3;
            else if (note.includes('दो') || note.includes('2')) marriagesCount = 2;
            else if (note.includes('चार') || note.includes('4')) marriagesCount = 4;
          } else {
            notes.push(note);
          }
        });
      }

      let nameOnly = cleanName.replace(/\(.*\)/g, '').trim();
      if (nameOnly && !nameOnly.endsWith('तिवारी')) {
        nameOnly += ' तिवारी';
      }
      return { rawName, cleanName: nameOnly, notes, marriagesCount, marriageNote };
    }

    function parseTree(rawTreeData) {
      let idCounter = 1;
      const members = [];
      const memberMap = new Map();

      function traverse(node, fatherId = null, gen = 1) {
        const rawName = node.text?.name || 'अज्ञात';
        const title = node.text?.title || '';
        const dob = node.text?.DOB || null;
        const pid = node.id || `P_${String(idCounter++).padStart(3, '0')}`;

        const { cleanName, notes, marriagesCount, marriageNote } = extractDetailsFromName(rawName);

        const person = {
          Person_ID: pid,
          Full_Name: cleanName,
          Raw_Name: rawName,
          Father_ID: fatherId,
          DOB: dob,
          Gender: 'Male',
          Occupation: title || (notes.includes('शास्त्री') ? 'ज्योतिषाचार्य / शास्त्री' : 'कृषि एवं समाज सेवा'),
          Profile_Image: DEFAULT_AVATAR,
          Notes: notes,
          Marriages_Count: marriagesCount,
          Marriage_Note: marriageNote,
          Generation_Level: gen,
          Children_IDs: []
        };

        members.push(person);
        memberMap.set(pid, person);

        if (fatherId && memberMap.has(fatherId)) {
          memberMap.get(fatherId).Children_IDs.push(pid);
        }

        if (node.children && Array.isArray(node.children)) {
          node.children.forEach(c => traverse(c, pid, gen + 1));
        }
      }

      rawTreeData.forEach(r => traverse(r, null, 1));
      return { members, memberMap };
    }

    function hasMatchingDescendant(node, query) {
      if (!query || !query.trim()) return false;
      const q = query.toLowerCase().trim();
      const name = (node.text?.name || '').toLowerCase();

      if (name.includes(q)) return true;

      if (node.children && Array.isArray(node.children) && node.children.length > 0) {
        return node.children.some(child => hasMatchingDescendant(child, query));
      }
      return false;
    }

    // COMPONENT: HIERARCHY TREE NODE
    function TreeNodeItem({ node, highlightName, onSelectMember }) {
      const hasChildren = node.children && node.children.length > 0;
      const queryTrimmed = highlightName ? highlightName.trim() : '';

      const isDirectMatch = Boolean(queryTrimmed && node.text?.name && 
        node.text.name.toLowerCase().includes(queryTrimmed.toLowerCase()));

      const childMatches = Boolean(queryTrimmed && hasChildren && 
        hasMatchingDescendant(node, queryTrimmed));

      const [userCollapsed, setUserCollapsed] = useState(false);
      const shouldBeOpen = queryTrimmed ? (childMatches || isDirectMatch) : !userCollapsed;

      return e('div', { className: 'flex flex-col text-xs my-0.5 select-none animate-fadeIn' },
        e('div', { className: 'flex items-center gap-1.5 py-0.5 group cursor-pointer' },
          hasChildren ? e('button', {
            onClick: (ev) => { ev.stopPropagation(); setUserCollapsed(shouldBeOpen ? true : false); },
            className: 'w-4 h-4 rounded hover:bg-slate-800 flex items-center justify-center text-primary font-bold text-[10px]'
          }, shouldBeOpen ? '▼' : '▶') : e('span', { className: 'w-4 inline-block' }),

          e('span', {
            onClick: () => onSelectMember && onSelectMember(node.text?.name),
            className: `px-2 py-1 rounded-md font-semibold transition-all ${
              isDirectMatch 
                ? 'bg-amber-400 text-slate-950 font-black shadow-lg shadow-amber-400/50 ring-2 ring-amber-300 scale-105' 
                : (childMatches ? 'text-indigo-300 font-bold bg-indigo-950/40' : 'text-slate-200 hover:text-indigo-300 hover:bg-slate-900/60')
            }`
          }, node.text?.name || '')
        ),

        (hasChildren && shouldBeOpen) ? e('div', { className: 'ml-4 pl-2 tree-connector-line flex flex-col' },
          node.children.map((child, idx) => e(TreeNodeItem, {
            key: idx,
            node: child,
            highlightName,
            onSelectMember
          }))
        ) : null
      );
    }

    // COMPONENT: RESPONSIVE CUSTOM CALENDAR DATE PICKER
    function ResponsiveDatePicker({ value, onChange, placeholder = 'जन्म तिथि चुनें (Select DOB)' }) {
      const [isOpen, setIsOpen] = useState(false);

      const today = new Date();
      const todayYear = today.getFullYear();
      const todayMonth = today.getMonth();
      const todayDay = today.getDate();

      const [navYear, setNavYear] = useState(() => {
        if (value) {
          const parts = String(value).split(/[\/\-]/);
          if (parts.length === 3 && parts[0].length === 4) return parseInt(parts[0], 10);
        }
        return todayYear;
      });

      const [navMonth, setNavMonth] = useState(() => {
        if (value) {
          const parts = String(value).split(/[\/\-]/);
          if (parts.length === 3 && parts[0].length === 4) return parseInt(parts[1], 10) - 1;
        }
        return todayMonth;
      });

      const yearOptions = useMemo(() => {
        const list = [];
        for (let y = todayYear; y >= 1920; y--) list.push(y);
        return list;
      }, [todayYear]);

      const daysGrid = useMemo(() => {
        const firstDayIndex = new Date(navYear, navMonth, 1).getDay();
        const totalDaysInMonth = new Date(navYear, navMonth + 1, 0).getDate();

        const grid = [];
        for (let i = 0; i < firstDayIndex; i++) grid.push(null);
        for (let day = 1; day <= totalDaysInMonth; day++) grid.push(day);
        return grid;
      }, [navYear, navMonth]);

      const handleSelectDay = (day) => {
        if (!day) return;
        const selectedDate = new Date(navYear, navMonth, day);
        if (selectedDate > today) return;

        const mStr = String(navMonth + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const formatted = `${navYear}-${mStr}-${dStr}`;
        onChange(formatted);
        setIsOpen(false);
      };

      const displayFormattedDate = useMemo(() => {
        if (!value) return '';
        const parts = String(value).split(/[\/\-]/);
        if (parts.length === 3 && parts[0].length === 4) {
          return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return value;
      }, [value]);

      return e('div', { className: 'relative w-full' },
        e('div', {
          onClick: () => setIsOpen(!isOpen),
          className: 'w-full p-3 bg-navy-950 border border-slate-700 rounded-xl text-white font-mono cursor-pointer flex items-center justify-between shadow-inner hover:border-indigo-500 transition-all'
        },
          e('span', { className: displayFormattedDate ? 'font-bold text-indigo-200' : 'text-slate-400 font-sans text-xs' },
            displayFormattedDate || placeholder
          ),
          e('span', { className: 'text-amber-400 text-sm' }, '📅')
        ),

        isOpen && e('div', { className: 'absolute left-0 top-14 z-50 w-full max-w-xs sm:w-80 glass-card p-4 shadow-2xl border-2 border-indigo-500/80 animate-fadeIn' },
          e('div', { className: 'flex items-center justify-between gap-1.5 mb-3 pb-2 border-b border-slate-800' },
            e('select', {
              value: navMonth,
              onChange: (ev) => setNavMonth(parseInt(ev.target.value, 10)),
              className: 'bg-navy-900 border border-slate-700 rounded-lg text-white text-xs p-1.5 font-bold outline-none'
            },
              MONTH_NAMES_ENGLISH.map((mName, idx) => e('option', { key: idx, value: idx }, `${mName} (${MONTH_NAMES_HINDI[idx]})`))
            ),

            e('select', {
              value: navYear,
              onChange: (ev) => setNavYear(parseInt(ev.target.value, 10)),
              className: 'bg-navy-900 border border-slate-700 rounded-lg text-white text-xs p-1.5 font-bold outline-none font-mono'
            },
              yearOptions.map(y => e('option', { key: y, value: y }, y))
            ),

            e('button', {
              type: 'button',
              onClick: () => setIsOpen(false),
              className: 'w-6 h-6 rounded-full bg-slate-800 hover:bg-rose-500 text-white font-bold text-xs flex items-center justify-center'
            }, '✕')
          ),

          e('div', { className: 'grid grid-cols-7 text-center text-[10px] font-bold text-slate-400 mb-1' },
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => e('div', { key: d, className: d === 'Sun' ? 'text-rose-400' : '' }, d))
          ),

          e('div', { className: 'grid grid-cols-7 gap-1 text-center text-xs' },
            daysGrid.map((day, idx) => {
              if (!day) return e('div', { key: idx });
              const cellDate = new Date(navYear, navMonth, day);
              const isFuture = cellDate > today;
              const isToday = navYear === todayYear && navMonth === todayMonth && day === todayDay;
              
              let isSelected = false;
              if (value) {
                const parts = String(value).split(/[\/\-]/);
                if (parts.length === 3 && parts[0].length === 4) {
                  isSelected = (parseInt(parts[0], 10) === navYear && (parseInt(parts[1], 10) - 1) === navMonth && parseInt(parts[2], 10) === day);
                }
              }

              return e('button', {
                key: idx,
                type: 'button',
                disabled: isFuture,
                onClick: () => handleSelectDay(day),
                className: `h-8 rounded-lg font-bold text-xs flex items-center justify-center transition-all ${
                  isFuture ? 'text-slate-600 cursor-not-allowed opacity-30' : (
                    isSelected ? 'bg-indigo-600 text-white font-black shadow-lg shadow-indigo-500/50 scale-105 border border-indigo-300' : (
                      isToday ? 'bg-amber-500/20 text-amber-300 border border-amber-500/50' : 'text-slate-200 hover:bg-navy-800 hover:text-indigo-300'
                    )
                  )
                }`
              }, day);
            })
          ),

          e('div', { className: 'mt-3 pt-2 border-t border-slate-800 flex justify-between items-center text-[10px]' },
            e('button', {
              type: 'button',
              onClick: () => { setNavYear(todayYear); setNavMonth(todayMonth); handleSelectDay(todayDay); },
              className: 'text-amber-400 font-bold hover:underline'
            }, 'Today (आज)'),
            e('span', { className: 'text-slate-500 font-mono' }, 'Future dates blocked')
          )
        )
      );
    }

    function App() {
      const [treeSourceData, setTreeSourceData] = useState([]);
      const [dbConnected, setDbConnected] = useState(false);

      // Pending Birth Requests State
      const [pendingRequests, setPendingRequests] = useState([]);

      // Fetch Tree & Pending Requests from Database REST API
      const refreshDataFromDb = () => {
        fetch(`${API_BASE_URL}/tree`)
          .then(res => res.ok ? res.json() : Promise.reject())
          .then(resData => {
            if (resData.success && Array.isArray(resData.data)) {
              setTreeSourceData(resData.data);
              setDbConnected(true);
            }
          })
          .catch(() => setDbConnected(false));

        fetch(`${API_BASE_URL}/pending-requests`)
          .then(res => res.ok ? res.json() : null)
          .then(resData => {
            if (resData && resData.success) {
              setPendingRequests(resData.data);
            }
          })
          .catch(() => {});
      };

      useEffect(() => {
        refreshDataFromDb();
      }, []);

      const { members, memberMap } = useMemo(() => parseTree(treeSourceData), [treeSourceData]);

      // Registered Users State
      const [users, setUsers] = useState(() => {
        try {

            if (parsed && parsed.month === curMonth) {

                id: m.Person_ID,
                name: m.Full_Name,
                dobRaw: m.DOB,
                day: parsed.day,
                month: parsed.month,
                image: m.Profile_Image
              });
            }
          }
        });

        allPeopleList.sort((a, b) => a.day - b.day);

        let nextUpcoming = allPeopleList.find(p => p.day >= curDay);
        if (!nextUpcoming && allPeopleList.length > 0) {
          nextUpcoming = allPeopleList[0];
        }

        return {
          birthdaysThisMonth: allPeopleList,
          nextUpcomingPerson: nextUpcoming,
          currentMonthNameEng: curEngName,

      // EMAIL-BASED OTP LOGIN HANDLERS
      const handleSendLoginOtp = () => {
        if (!loginEmail || !loginEmail.trim().includes('@') || !loginEmail.trim().includes('.')) {
          setLoginError('वैध रजिस्टर्ड ईमेल आईडी दर्ज करें (Valid registered email address required)');
          return;
        }

        const cleanEmail = loginEmail.trim().toLowerCase();
        setLoginError('');
        setIsAuthLoading(true);

        fetch(`${API_BASE_URL}/auth/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: cleanEmail })
        })
          .then(res => res.json())
          .then(resData => {
            setIsAuthLoading(false);
            if (resData.success) {
              setLoginOtpSent(true);
              setLoginOtpVal(''); // OTP input left blank for user email entry
              setLoginOtpToken(resData.otpToken || '');
              setResendCooldown(resData.resendCooldownSeconds || 30);
              setAttemptsLeft(5);
              setAuthSuccessMsg(resData.message || 'OTP has been sent to your registered email. Please check your email inbox.');
            } else {
              setLoginError(resData.message || 'Verification email failed to send.');
            }
          })
          .catch(err => {
            setIsAuthLoading(false);
            setLoginError('Server connection error. Please try again.');
          });
      };

      const handleVerifyLoginOtp = () => {
        if (!loginOtpVal || loginOtpVal.trim().length !== 6) {
          setLoginError('6 अंकों का OTP दर्ज करें (6-digit OTP required)');
          return;
        }

        const cleanEmail = loginEmail.trim().toLowerCase();
        setLoginError('');
        setIsAuthLoading(true);

        fetch(`${API_BASE_URL}/auth/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: cleanEmail, otp: loginOtpVal.trim(), otpToken: loginOtpToken })
        })
          .then(res => res.json())
          .then(resData => {
            setIsAuthLoading(false);
            if (resData.success && resData.user) {
              const authUser = resData.user;
              try {
                if (resData.token) localStorage.setItem('familygen_jwt_token', resData.token);
                localStorage.setItem('familygen_auth_user', JSON.stringify(authUser));
              } catch(e){}

              // Mark User Online locally
              const updatedUsers = users.map(u => u.id === authUser.id ? { ...u, is_online: true, last_login: new Date().toISOString() } : u);
              setUsers(updatedUsers);

              setCurrentUser(authUser);
              showToast(`Login Successful! Welcome ${authUser.full_name}`);
              setActiveTab('dashboard');
              setView('dashboard');
            } else {
              if (resData.remainingAttempts !== undefined) {
                setAttemptsLeft(resData.remainingAttempts);
              }
              setLoginError(resData.message || 'Invalid OTP code. Please try again.');
            }
          })
          .catch(err => {
            setIsAuthLoading(false);
            setLoginError('Server verification error.');
          });
      };

      const handleResendLoginOtp = () => {
        if (resendCooldown > 0) return;
        handleSendLoginOtp();
      };

      const handleLogout = () => {
        if (currentUser && currentUser.email) {
          fetch(`${API_BASE_URL}/auth/logout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentUser.email, userId: currentUser.id })
          }).catch(() => {});
        }

        try {
          localStorage.removeItem('familygen_jwt_token');
          localStorage.removeItem('familygen_auth_user');
        } catch(e){}

        if (currentUser) {
          setUsers(users.map(u => u.id === currentUser.id ? { ...u, is_online: false } : u));
        }

        setCurrentUser(null);
        setLoginOtpSent(false);
        setLoginEmail('');
        setLoginOtpVal('');
        setLoginError('');
        setView('login');

      // REGISTRATION FORM SUBMISSION (MANDATORY EMAIL ID + BUTTON "Register" + DEFAULT ROLE = MEMBER)
      const handleRegSubmitStep1 = (ev) => {
        ev.preventDefault();
        const errs = {};
        if (!regForm.first_name.trim()) errs.first_name = 'पहला नाम आवश्यक है (First Name required)';
        if (!regForm.surname.trim()) errs.surname = 'उपनाम आवश्यक है (Surname required)';
        if (!regForm.dob.trim()) errs.dob = 'जन्म तिथि आवश्यक है (Date of Birth required)';
        if (!regForm.mobile_number.trim() || regForm.mobile_number.trim().length !== 10) {
          errs.mobile_number = '10 अंकों का वैध मोबाइल नंबर दर्ज करें (Valid 10-digit mobile required)';
        }
        if (!regForm.email.trim() || !regForm.email.trim().includes('@') || !regForm.email.trim().includes('.')) {
          errs.email = 'वैध ईमेल आईडी दर्ज करें (Mandatory valid email address required)';

        if (Object.keys(errs).length > 0) {
          setRegErrors(errs);
          return;
        }

        setRegErrors({});
        setIsAuthLoading(true);

        fetch(`${API_BASE_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName: regForm.first_name.trim(),
            surname: regForm.surname.trim(),
            dob: regForm.dob.trim(),
            mobileNumber: regForm.mobile_number.trim(),
            email: regForm.email.trim().toLowerCase()

            setIsAuthLoading(false);
            if (resData.success) {
              if (resData.user) {
                setUsers(prev => [resData.user, ...prev]);

            setRegErrors({ email: 'Server error during registration.' });
          });

                  })
